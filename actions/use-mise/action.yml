name: 'Use Mise'
description: 'Use Mise with a pinned version'
inputs:
  github_token:
    description: 'Github token to use'
    required: true
  working_directory:
    required: false
    description: 'The directory that mise runs in'
runs:
  using: 'composite'
  steps:
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        github_token: ${{ inputs.github_token }}
        persist_github_token: true
        working_directory: ${{ inputs.working_directory }}
        cache_key_prefix: ${{ inputs.working_directory }}
        install_args: "--locked"
        export_path: false
        version: 2026.11.1
