name: 'Use Mise'
description: 'Use Mise with a pinned version'
inputs:
  github_token:
    description: 'Github token to use'
    required: true
  working_directory:
    required: false
    description: 'The directory that mise runs in'
runs:
  using: 'composite'
  steps:
    - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        github_token: ${{ inputs.github_token }}
        persist_github_token: true
        working_directory: ${{ inputs.working_directory }}
        cache_key_prefix: ${{ inputs.working_directory }}
        install_args: "--locked"
        export_path: false
        version: 2026.10.23
