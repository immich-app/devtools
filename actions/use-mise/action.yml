name: 'Use Mise'
description: 'Use Mise with a pinned version'
inputs:
  github_token:
    description: 'Github token to use'
    required: true
  working_directory:
    required: false
    description: 'The directory that mise runs in'
runs:
  using: 'composite'
  steps:
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        github_token: ${{ inputs.github_token }}
        persist_github_token: true
        working_directory: ${{ inputs.working_directory }}
        cache_key_prefix: ${{ inputs.working_directory }}
        install_args: "--locked"
        version: 2026.10.5
