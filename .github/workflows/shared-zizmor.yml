name: Zizmor
on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: token
        uses: immich-app/devtools/actions/create-workflow-token@2760f037fd3707bb91b16e4c41dc62b8c512393e # create-workflow-token-action-v3.1.0
        with:
          client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}
          permission-contents: read

      - name: Fetch org zizmor config
        run: |
          mkdir -p .github
          curl -fsSL --retry 3 --no-clobber \
            https://raw.githubusercontent.com/immich-app/.github/main/zizmor-config.yml \
            -o .github/zizmor.yml

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          token: ${{ steps.token.outputs.token }}
          # Uploading SARIF needs code scanning, which requires GitHub
          # Advanced Security — private repos in this org don't have it, so the
          # upload fails the run. Zizmor is a required check org-wide, so it has
          # to keep reporting there: fall back to inline annotations instead.
          advanced-security: ${{ !github.event.repository.private }}
          annotations: ${{ github.event.repository.private }}
