---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: outline
  namespace: tools
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.5.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      outline:
        containers:
          app:
            image:
              repository: docker.io/outlinewiki/outline
              tag: 1.12.0@sha256:25d6a2ced2f1f0cf03c09abd776d87ba31941ed96d3a99992aa84b3bd0afc074
            env:
              #ref https://github.com/outline/outline/blob/d3c8224839f09fbff601e4a3e7fd8ff1a6b2ba08/.env.sample
              URL: "https://outline.immich.cloud"
              REDIS_URL: "redis://outline-valkey:6379"
              ENABLE_UPDATES: false
              FILE_STORAGE: local
              FILE_STORAGE_LOCAL_ROOT_DIR: /data
              FILE_STORAGE_UPLOAD_MAX_SIZE: &upload-limit "104857600"
              FILE_STORAGE_IMPORT_MAX_SIZE: *upload-limit
              OIDC_SCOPES: "openid profile email"
              OIDC_AUTH_URI: "https://auth.internal.futo.org/oauth/v2/authorize"
              OIDC_TOKEN_URI: "https://auth.internal.futo.org/oauth/v2/token"
              OIDC_USERINFO_URI: "https://auth.internal.futo.org/oidc/v1/userinfo"
              WEB_CONCURRENCY: 10
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: outline-db-app
                    key: uri
            envFrom:
              - secretRef:
                  name: outline-secret-keys
              - secretRef:
                  name: outline-oauth-client
            securityContext:
              fsGroup: 1001
      valkey:
        containers:
          app:
            image:
              repository: valkey/valkey
              tag: 9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    persistence:
      data:
        enabled: true
        existingClaim: outline
        advancedMounts:
          outline:
            app:
              - path: /data
    service:
      app:
        controller: outline
        ports:
          http:
            port: 3000
      valkey:
        controller: valkey
        ports:
          main:
            port: 6379
    ingress:
      app:
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          nginx.ingress.kubernetes.io/proxy-body-size: *upload-limit
        hosts:
          - host: &host "outline.immich.cloud"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
            secretName: outline-tls
      futo:
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          nginx.ingress.kubernetes.io/configuration-snippet: |
            return 302 https://outline.immich.cloud$request_uri;
        hosts:
          - host: &futo-host "outline.futo.org"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *futo-host
            secretName: outline-futo-tls
