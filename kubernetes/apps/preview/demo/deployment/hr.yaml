apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: demo
  namespace: preview
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: immich-charts
    namespace: flux-system
  values:
    valkey:
      enabled: true
    immich:
      persistence:
        library:
          existingClaim: ignored
    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: demo-database-superuser
                    key: host
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: demo-database-superuser
                    key: user
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: demo-database-superuser
                    key: password
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: demo-database-app
                    key: dbname
              LOG_LEVEL: verbose
              MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: ViT-SO400M-16-SigLIP2-384__webli
            image:
              tag: release
    server:
      configMaps:
        helmet:
          data:
            # The bundled server/helmet.json policy in report-only mode, plus
            # 'report-sample' because GlitchTip keeps little else to tell reports
            # apart. Helmet's other headers are enforced regardless of reportOnly,
            # so they are all switched off to leave the demo's behaviour unchanged.
            helmet.json: |
              {
                "contentSecurityPolicy": {
                  "reportOnly": true,
                  "directives": {
                    "default-src": ["'self'"],
                    "script-src": ["'self'", "'wasm-unsafe-eval'", "https://www.gstatic.com", "'report-sample'"],
                    "style-src": ["'self'", "'report-sample'"],
                    "style-src-attr": ["'unsafe-inline'"],
                    "img-src": ["'self'", "data:", "blob:"],
                    "media-src": ["'self'", "data:", "blob:"],
                    "connect-src": [
                      "'self'",
                      "blob:",
                      "https://pay.futo.org",
                      "https://static.immich.cloud",
                      "https://tiles.immich.cloud"
                    ],
                    "worker-src": ["'self'", "blob:"],
                    "frame-src": ["'none'"],
                    "object-src": ["'none'"],
                    "base-uri": ["'self'"],
                    "upgrade-insecure-requests": null,
                    "report-uri": ["https://glitchtip.futostatus.com/api/2/security/?glitchtip_key=2dc0ee139e7b484395d9ea4608a552ee"]
                  }
                },
                "crossOriginOpenerPolicy": false,
                "crossOriginResourcePolicy": false,
                "originAgentCluster": false,
                "referrerPolicy": false,
                "strictTransportSecurity": false,
                "xContentTypeOptions": false,
                "xDnsPrefetchControl": false,
                "xDownloadOptions": false,
                "xFrameOptions": false,
                "xPermittedCrossDomainPolicies": false,
                "xXssProtection": false
              }
      controllers:
        main:
          containers:
            main:
              env:
                IMMICH_HELMET_FILE: /helmet/helmet.json
              image:
                pullPolicy: Always
      persistence:
        helmet:
          type: configMap
          identifier: helmet
          globalMounts:
            - path: /helmet
              readOnly: true
        data:
          type: custom
          volumeSpec:
            ephemeral: # This way, the volume restores from snapshot every time the pod is recreated
              volumeClaimTemplate:
                spec:
                  dataSource:
                    name: demo-library-snapshot
                    kind: VolumeSnapshot
                    apiGroup: snapshot.storage.k8s.io
                  storageClassName: zfs
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 100Gi
      ingress:
        main:
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-production
            nginx.ingress.kubernetes.io/configuration-snippet: |
              more_set_headers 'Access-Control-Allow-Origin: *';
              more_set_headers 'Access-Control-Allow-Credentials: false';
              more_set_headers 'Access-Control-Allow-Methods: GET, POST, PUT, PATCH, DELETE';
              more_set_headers 'Access-Control-Allow-Headers: x-immich-session-token, x-api-key, Authorization, Content-Type';

              if ($request_method = 'OPTIONS') {
                  more_set_headers 'Access-Control-Max-Age: 3600';
                  more_set_headers 'Content-Type: text/plain charset=UTF-8';
                  more_set_headers 'Content-Length: 0';
                  return 204;
              }

              if ($request_method = PUT) {
                set $block_put 1;
              }
              if ($uri ~ ^/api/(system-config|users/me|admin/users/.*|users/profile-image|assets/.*/original|auth/change-password)$) {
                set $block_put "${block_put}1";
              }
              if ($block_put = 11) {
                return 403;
              }

              if ($request_method = POST) {
                set $block_post 1;
              }
              if ($uri ~ ^/api/(system-config|users/me|admin/maintenance|admin/users/.*|users/profile-image|assets|auth/change-password|notifications/test-email|libraries|trash/empty)$) {
                set $block_post "${block_post}1";
              }
              if ($block_post = 11) {
                return 403;
              }

              if ($request_method = DELETE) {
                set $block_delete 1;
              }
              if ($uri ~ ^/api/(admin/users/.*)$) {
                set $block_delete "${block_delete}1";
              }
              if ($block_delete = 11) {
                return 403;
              }

              add_header 'Vary' 'Origin' always;
          hosts:
            - host: demo.immich.app
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - demo.immich.app
              secretName: demo-tls
    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                pullPolicy: Always
